<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>वार्तालाप · Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0c14; color: #f5eff7; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    .mark { width: 80px; height: 80px; margin: 0 auto 16px; border-radius: 26px; display: grid; place-items: center; font-size: 46px; font-weight: 800; background: linear-gradient(135deg, #ff9a1f, #f0573f 55%, #c43c9b); }
    p { color: #b5a9bb; }
    button { margin-top: 16px; padding: 14px 28px; border: 0; border-radius: 999px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #ff9a1f, #f0573f 55%, #c43c9b); }
    .link { display: block; margin-top: 14px; color: #b5a9bb; background: none; font-weight: 500; font-size: 14px; }
  </style>
</head>
<body>
  <div>
    <div class="mark">व</div>
    <h1>You're offline</h1>
    <p>वार्तालाप will reconnect as soon as you're back online.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
    <button class="link" onclick="localStorage.removeItem('vt:server'); location.href = 'index.html'">Change server</button>
  </div>
</body>
</html>
